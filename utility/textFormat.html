<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字格式化工具 | Utility</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        .nav-bar { margin-bottom: 20px; display: flex; gap: 15px; }
        .nav-bar a { color: #0366d6; text-decoration: none; font-size: 0.9em; }
        .nav-bar a:hover { text-decoration: underline; }
        textarea { width: 100%; height: 160px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .btn-group { margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 8px 16px; background-color: #0366d6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #0255b3; }
        button.secondary { background-color: #6c757d; }
        button.secondary:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html">← 回到工具箱首頁</a>
        <a href="../index.html">⌂ 回到網站主首頁</a>
    </div>

    <h1>文字格式化工具</h1>

    <label for="inputText">輸入文字：</label>
    <textarea id="inputText" placeholder="請在此貼上欲處理的文字..."></textarea>

    <div class="btn-group">
        <button onclick="trimSpaces()">清除多餘空白</button>
        <button onclick="toUpperCase()">轉為大寫 (UPPER)</button>
        <button onclick="toLowerCase()">轉為小寫 (lower)</button>
        <button class="secondary" onclick="clearAll()">清空內容</button>
    </div>

    <label for="outputText">處理結果：</label>
    <textarea id="outputText" readonly placeholder="處理後的結果會顯示在這裡..."></textarea>

    <script>
        function trimSpaces() {
            const input = document.getElementById('inputText').value;
            // 清除首尾空白與行內重複空白
            document.getElementById('outputText').value = input.trim().replace(/[ \t]+/g, ' ');
        }

        function toUpperCase() {
            const input = document.getElementById('inputText').value;
            document.getElementById('outputText').value = input.toUpperCase();
        }

        function toLowerCase() {
            const input = document.getElementById('inputText').value;
            document.getElementById('outputText').value = input.toLowerCase();
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
        }
    </script>

</body>
</html>
