<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景調色工具</title>
    <!-- 引入 iro.js -->
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.1s, color 0.1s;
        }

        .nav-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        .nav-bar a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
        }

        .nav-bar a:hover {
            text-decoration: underline;
        }

        /* 按鈕容器 */
        .button-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* 靠左的小按鈕 */
        button.action-btn {
            display: inline-block;
            width: auto;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button.action-btn:hover {
            opacity: 0.85;
        }

        /* 當進入全螢幕時，自動將所有介面元素隱藏，保留百分之百純淨背景 */
        :fullscreen .nav-bar,
        :fullscreen .button-group {
            display: none !important;
        }

        /* 彈跳視窗樣式 */
        .color-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            color: #333333;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 280px;
        }

        /* 預設顏色圓形按鈕區塊 */
        .preset-colors {
            display: flex;
            gap: 10px;
            margin: 12px 0;
            justify-content: center;
        }

        .preset-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .preset-circle:hover {
            transform: scale(1.15);
            border-color: #333;
        }

        .input-group {
            margin-top: 8px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .input-group input {
            width: 130px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 0.9rem;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            width: 100%;
        }

        .modal-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-confirm {
            background-color: #0066cc;
            color: white;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>

    <!-- 1. 頂部導覽列（包含兩個返回連結） -->
    <div class="nav-bar">
        <a href="index.html">← 回到線上工具首頁</a>
        <a href="../index.html">⌂ 回到網站主首頁</a>
    </div>

    <!-- 2. 按鈕區 (選擇背景顏色 + 全螢幕) -->
    <div class="button-group">
        <button type="button" class="action-btn" onclick="openColorPicker()">選擇背景顏色</button>
        <button type="button" class="action-btn" onclick="toggleFullscreen()">全螢幕</button>
    </div>

    <!-- 調色盤 Modal -->
    <div id="colorModal" class="color-modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 1.1rem; color: #333;">選擇背景顏色</h3>
            
            <!-- iro.js 圓形色盤容器 -->
            <div id="picker"></div>

            <!-- 預設快速顏色圓形按鈕 (白、黑、紅、綠、藍) -->
            <div class="preset-colors">
                <div class="preset-circle" style="background-color: #ffffff;" onclick="selectPreset('#ffffff')" title="白"></div>
                <div class="preset-circle" style="background-color: #000000;" onclick="selectPreset('#000000')" title="黑"></div>
                <div class="preset-circle" style="background-color: #ff0000;" onclick="selectPreset('#ff0000')" title="紅"></div>
                <div class="preset-circle" style="background-color: #00ff00;" onclick="selectPreset('#00ff00')" title="綠"></div>
                <div class="preset-circle" style="background-color: #0000ff;" onclick="selectPreset('#0000ff')" title="藍"></div>
            </div>

            <!-- 手動輸入區 (#RRGGBB 與 RGB，字母大寫) -->
            <div class="input-group">
                <label for="hexInput">Hex 色碼：</label>
                <input type="text" id="hexInput" oninput="updateFromHex(this.value)">
            </div>
            <div class="input-group">
                <label for="rInput">R (紅 0-255)：</label>
                <input type="number" id="rInput" min="0" max="255" oninput="updateFromRGB()">
            </div>
            <div class="input-group">
                <label for="gInput">G (綠 0-255)：</label>
                <input type="number" id="gInput" min="0" max="255" oninput="updateFromRGB()">
            </div>
            <div class="input-group">
                <label for="bInput">B (藍 0-255)：</label>
                <input type="number" id="bInput" min="0" max="255" oninput="updateFromRGB()">
            </div>

            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeColorPicker()">取消</button>
                <button type="button" class="btn-confirm" onclick="closeColorPicker()">確定</button>
            </div>
        </div>
    </div>

<script>
    let currentBgColor = "#ffffff";

    // 初始化 iro.js 圓形色盤
    var colorPicker = new iro.ColorPicker("#picker", {
        width: 220,
        color: "#ffffff",
        layout: [
            { component: iro.ui.Wheel },
            { component: iro.ui.Slider, options: { sliderType: 'value' } }
        ]
    });

    function openColorPicker() {
        document.getElementById('colorModal').style.display = 'flex';
        colorPicker.color.hexString = currentBgColor;
        syncInputs(currentBgColor);
    }

    function closeColorPicker() {
        document.getElementById('colorModal').style.display = 'none';
    }

    // 計算反向顏色
    function getInverseColor(hex) {
        let cleanHex = hex.replace('#', '');
        if (cleanHex.length === 3) {
            cleanHex = cleanHex.split('').map(c => c + c).join('');
        }
        const r = parseInt(cleanHex.substr(0, 2), 16) || 0;
        const g = parseInt(cleanHex.substr(2, 2), 16) || 0;
        const b = parseInt(cleanHex.substr(4, 2), 16) || 0;

        const invR = 255 - r;
        const invG = 255 - g;
        const invB = 255 - b;

        return `#${invR.toString(16).padStart(2, '0')}${invG.toString(16).padStart(2, '0')}${invB.toString(16).padStart(2, '0')}`.toUpperCase();
    }

    function applyBackgroundColor(hex) {
        currentBgColor = hex.toUpperCase();
        const inverseHex = getInverseColor(hex);
        document.documentElement.style.setProperty('--bg-color', currentBgColor);
        document.documentElement.style.setProperty('--text-color', inverseHex);
    }

    function syncInputs(hex) {
        let cleanHex = hex.replace('#', '');
        if (cleanHex.length === 3) {
            cleanHex = cleanHex.split('').map(c => c + c).join('');
        }
        const fullHex = '#' + cleanHex.toUpperCase();
        
        document.getElementById('hexInput').value = fullHex;

        const r = parseInt(cleanHex.substr(0, 2), 16) || 0;
        const g = parseInt(cleanHex.substr(2, 2), 16) || 0;
        const b = parseInt(cleanHex.substr(4, 2), 16) || 0;

        document.getElementById('rInput').value = r;
        document.getElementById('gInput').value = g;
        document.getElementById('bInput').value = b;
    }

    // 點擊預設顏色圓形按鈕
    function selectPreset(hex) {
        colorPicker.color.hexString = hex;
        applyBackgroundColor(hex);
        syncInputs(hex);
    }

    // 監聽色盤拉動與點擊
    colorPicker.on('color:change', function(color) {
        const hex = color.hexString;
        applyBackgroundColor(hex);
        syncInputs(hex);
    });

    // 透過 Hex 輸入連動
    function updateFromHex(val) {
        if (/^#?[0-9A-Fa-f]{3}$\vert{}^#?[0-9A-Fa-f]{6}$/.test(val)) {
            let fullHex = val.startsWith('#') ? val : '#' + val;
            colorPicker.color.hexString = fullHex;
            applyBackgroundColor(fullHex);
            syncInputs(fullHex);
        }
    }

    // 透過 R、G、B 輸入連動
    function updateFromRGB() {
        let r = parseInt(document.getElementById('rInput').value) || 0;
        let g = parseInt(document.getElementById('gInput').value) || 0;
        let b = parseInt(document.getElementById('bInput').value) || 0;

        r = Math.max(0, Math.min(255, r));
        g = Math.max(0, Math.min(255, g));
        b = Math.max(0, Math.min(255, b));

        const hex = `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`.toUpperCase();
        colorPicker.color.hexString = hex;
        applyBackgroundColor(hex);
        document.getElementById('hexInput').value = hex;
    }

    // 全螢幕切換功能
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`無法進入全螢幕: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>

</body>
</html>
